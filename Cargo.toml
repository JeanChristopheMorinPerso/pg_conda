[package]
name = "pg_conda"
version = "1.0.1"
edition = "2024"
resolver = "3"

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg17"]
pg13 = ["pgrx/pg13" ]
pg14 = ["pgrx/pg14" ]
pg15 = ["pgrx/pg15" ]
pg16 = ["pgrx/pg16" ]
pg17 = ["pgrx/pg17" ]
no-schema-generation = ["pgrx/no-schema-generation"]

[dependencies]
pgrx = "0.18.1"
rattler_conda_types = "0.36.0"
serde = "1.0.228"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1

[lints.clippy]
needless_return = "allow"
